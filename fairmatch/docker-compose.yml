# Local development stack. Not a production deployment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fairmatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      FM_ENV: development
      FM_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fairmatch
      FM_REDIS_URL: redis://redis:6379/0
      FM_PUBLIC_BASE_URL: http://10.0.2.2:8000
      FM_AI_PROVIDER: ${FM_AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    volumes: [media:/app/media]
volumes:
  pgdata:
  media:
