# Local development stack: API, CPU worker, scheduler, PostgreSQL, Redis, MinIO (S3).
# Copy .env.example to .env and set real secrets first. Not a production deployment:
# put the API behind a TLS-terminating reverse proxy and set VRV_REQUIRE_HTTPS=true.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vrvision
      POSTGRES_USER: vrvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrvision"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VRV_S3_ACCESS_KEY_ID:?set in .env}
      MINIO_ROOT_PASSWORD: ${VRV_S3_SECRET_ACCESS_KEY:?set in .env}
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$VRV_S3_ACCESS_KEY_ID $$VRV_S3_SECRET_ACCESS_KEY &&
             mc mb --ignore-existing local/vrvision"
    environment:
      VRV_S3_ACCESS_KEY_ID: ${VRV_S3_ACCESS_KEY_ID}
      VRV_S3_SECRET_ACCESS_KEY: ${VRV_S3_SECRET_ACCESS_KEY}

  api:
    build: .
    env_file: .env
    environment: &common
      VRV_DATABASE_URL: postgresql+psycopg://vrvision:${POSTGRES_PASSWORD}@postgres:5432/vrvision
      VRV_REDIS_URL: redis://redis:6379/0
      VRV_STORAGE_BACKEND: s3
      VRV_S3_ENDPOINT_URL: http://minio:9000
      VRV_S3_BUCKET: vrvision
    ports: ["8000:8000"]
    volumes: [uploads:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker:
    build: .
    env_file: .env
    environment: *common
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes: [uploads:/data]
    depends_on: [api]

  beat:
    build: .
    env_file: .env
    environment: *common
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
  uploads:
