name: LensPrompt — test & build debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LensPrompt/**"
      - ".github/workflows/lensprompt.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: LensPrompt
    env:
      # Strictly increasing versionCode for Play uploads.
      LENSPROMPT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: "tools" no longer exists.
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Smart Follow core + app)
        run: ./gradlew --no-daemon --stacktrace test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lensprompt-test-reports
          path: |
            LensPrompt/core/build/reports/tests/
            LensPrompt/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LensPrompt-debug-apk
          path: LensPrompt/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release signing is optional: with the upload-key secrets set, the AAB/APK
      # are signed with the upload key; without them they are built unsigned and
      # CI still passes. No key material is ever stored in the repository.
      - name: Prepare upload key (only if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.LENSPROMPT_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LENSPROMPT_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LENSPROMPT_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LENSPROMPT_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "LENSPROMPT_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"
              echo "LENSPROMPT_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
              echo "LENSPROMPT_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "LENSPROMPT_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Upload key configured: release artifacts will be signed."
          else
            echo "No upload key secrets: release artifacts will be UNSIGNED (fine for CI)."
          fi

      - name: Build release bundle (AAB) and APK
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease

      - name: Inspect release outputs
        run: |
          find app/build/outputs/bundle/release app/build/outputs/apk/release -type f | xargs ls -la
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          if jarsigner -verify "$AAB" > /dev/null 2>&1; then echo "AAB: signed"; else echo "AAB: unsigned (no upload key configured)"; fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -3
          sha256sum "$AAB" "$APK"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: LensPrompt-release-aab
          path: LensPrompt/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LensPrompt-release-apk
          path: LensPrompt/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove upload key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Offline recognition test material: small Vosk models (same download
      # candidates as the app) and synthesized speech (espeak-ng, 16 kHz PCM16).
      - name: Cache offline speech models
        uses: actions/cache@v4
        with:
          path: speech-test
          key: vosk-small-models-v1

      - name: Prepare offline speech test material
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          mkdir -p speech-test && cd speech-test
          fetch() { # key, candidates...
            key=$1; shift
            [ -s "$key.zip" ] && { echo "$key: cached"; return; }
            for name in "$@"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I "https://alphacephei.com/vosk/models/$name.zip")
              echo "$key: $name -> HTTP $code"
              if [ "$code" = "200" ]; then curl -sSfL -o "$key.zip" "https://alphacephei.com/vosk/models/$name.zip" && return; fi
            done
            echo "$key: no model available"
          }
          fetch en vosk-model-small-en-us-0.15
          fetch nl vosk-model-small-nl-0.22
          fetch fa vosk-model-small-fa-0.42 vosk-model-small-fa-0.5 vosk-model-small-fa-0.4
          for name in vosk-model-small-de-0.15 vosk-model-small-fr-0.22 vosk-model-small-es-0.42; do
            echo "check $name -> HTTP $(curl -s -o /dev/null -w '%{http_code}' -I https://alphacephei.com/vosk/models/$name.zip)"
          done
          say() { espeak-ng -v "$1" -s 140 -w "$2.wav" "$3" && ffmpeg -loglevel error -y -i "$2.wav" -ar 16000 -ac 1 -f s16le "$2.raw"; }
          say en-us en "The quick brown fox jumps over the lazy dog. Today we talk about a simple way to record better videos with a teleprompter."
          say nl nl "Vandaag praten we over een eenvoudige manier om betere video's op te nemen met een teleprompter."
          say fa fa "امروز درباره یک روش ساده برای ضبط ویدیوهای بهتر صحبت می کنیم."
          ls -la

      - name: Run instrumented smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: LensPrompt
          # Keep the emulator screen on and unlocked for the whole test run.
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent 82
            adb shell mkdir -p /data/local/tmp/lp
            for f in ../speech-test/*.zip ../speech-test/*.raw; do [ -s "$f" ] && adb push "$f" /data/local/tmp/lp/ > /dev/null; done
            adb shell ls -la /data/local/tmp/lp
            adb logcat -c
            ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest || (adb logcat -d -s LIBTREE:* LPVoskTest:* OfflineASR:* OfflineModel:* SpeechModels:* AndroidRuntime:E | head -250; exit 1)
            adb logcat -d -s LPVoskTest:* OfflineModel:*

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lensprompt-emulator-reports
          path: LensPrompt/app/build/reports/androidTests/
          if-no-files-found: ignore
