name: FairMatch CI

on:
  workflow_dispatch:
  push:
    paths:
      - "fairmatch/**"
      - ".github/workflows/fairmatch.yml"
  pull_request:
    paths:
      - "fairmatch/**"

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fairmatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: fairmatch/backend
    env:
      FM_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fairmatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  mobile:
    name: Flutter analyze, test & Android build
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
    defaults:
      run:
        working-directory: fairmatch/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK (talks to http://10.0.2.2:8000 by default; demo mode works offline)
        run: flutter build apk --debug --dart-define=FM_API_URL=${{ vars.FM_API_URL || 'http://10.0.2.2:8000' }}
      - name: Build release AAB (only when a signing key is configured)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
          flutter build appbundle --release --dart-define=FM_API_URL=${{ vars.FM_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: fairmatch-debug-apk
          path: fairmatch/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('fairmatch/mobile/build/app/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: fairmatch-release-aab
          path: fairmatch/mobile/build/app/outputs/bundle/release/app-release.aab
