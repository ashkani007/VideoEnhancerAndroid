name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Android project
        run: |
          unzip -o VideoEnhancerAndroid_GitHubBuild.zip

      - name: Change project to Android 36
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' VideoEnhancerAndroid/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' VideoEnhancerAndroid/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle -p VideoEnhancerAndroid :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoEnhancerPro-debug-apk
          path: VideoEnhancerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build APK
        run: gradle -p VideoEnhancerAndroid :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoEnhancerPro-debug-apk
          path: VideoEnhancerAndroid/app/build/outputs/apk/debug/app-debug.apk
