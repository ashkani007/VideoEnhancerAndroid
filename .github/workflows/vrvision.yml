name: VRVision CI

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - "android/**"
      - "backend/**"
      - "tools/**"
      - ".github/workflows/vrvision.yml"

concurrency:
  group: vrvision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      VRVISION_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (pure Kotlin)
        run: ./gradlew --no-daemon :core:test

      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Show lint report
        if: failure()
        run: |
          R=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          grep -A4 -E ": Error: " "$R" | head -120 || true
          tail -1 "$R" || true

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -4
          unzip -l "$APK" | grep -E "assets/models|libonnxruntime" || true
          sha256sum "$APK"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrvision-reports
          path: |
            android/core/build/reports/
            android/app/build/reports/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VRVision-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-device-tests:
    # Instrumented tests on an emulator: real MediaCodec + ONNX Runtime enhancement pipeline,
    # Room persistence and an app launch smoke test.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android
          script: |
            adb logcat -c
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || (adb logcat -d -s AndroidRuntime:E System.out:I TestRunner:* | tail -150; exit 1)
            adb logcat -d -s System.out:I | grep VRVISION_DEVICE_TEST || true

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrvision-device-test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Backend tests (includes real ONNX inference end-to-end)
        run: python -m pytest -q

      - name: Model conversion reproducibility
        working-directory: tools/model
        run: |
          pip install onnx==1.23.2
          curl -fsSLO https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -fsSLO https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth
          python convert_realesrgan_onnx.py --x4v3 realesr-general-x4v3.pth --wdn realesr-general-wdn-x4v3.pth --denoise-strength 1.0 --out /tmp/dn100.onnx > /dev/null
          python convert_realesrgan_onnx.py --x4v3 realesr-general-x4v3.pth --wdn realesr-general-wdn-x4v3.pth --denoise-strength 0.0 --out /tmp/dn0.onnx > /dev/null
          # The committed models must be byte-identical to a fresh conversion.
          cmp /tmp/dn100.onnx ../../android/app/src/main/assets/models/realesr_general_x4v3_dn100.onnx
          cmp /tmp/dn0.onnx ../../android/app/src/main/assets/models/realesr_general_x4v3_dn0.onnx
          cmp /tmp/dn100.onnx ../../backend/models/realesr_general_x4v3_dn100.onnx
          echo "Converted models are byte-identical to the committed ones."

  backend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API/worker image
        run: docker build -t vrvision-api:ci backend

      - name: Smoke test container
        run: |
          docker run -d --name vrv -p 8000:8000 \
            -e VRV_API_KEYS=ci-key -e VRV_TOKEN_SECRET=$(python3 -c "import secrets;print(secrets.token_urlsafe(48))") \
            -e VRV_DATABASE_URL=sqlite:////data/ci.db vrvision-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/v1/health && break; sleep 1; done
          echo
          curl -fs -X POST -H "X-API-Key: ci-key" localhost:8000/v1/auth/token | python3 -c "import json,sys; assert json.load(sys.stdin)['token']"
          docker exec vrv ffmpeg -version | head -1
          docker exec vrv python -c "import onnxruntime, numpy; print('onnxruntime', onnxruntime.__version__)"
          docker logs vrv | tail -5
          docker rm -f vrv

      - name: Validate compose file
        working-directory: backend
        run: cp .env.example .env && docker compose config -q && docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
